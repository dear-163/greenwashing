name: Keep Streamlit App Alive

on:
  schedule:
    # 每天台灣時間 09:00 (UTC+8) = UTC 01:00 自動喚醒
    - cron: '0 1 * * *'
    # 每天台灣時間 14:00 (UTC+8) = UTC 06:00 補喚一次
    - cron: '0 6 * * *'
  workflow_dispatch:  # 允許手動觸發

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install Playwright
        run: |
          pip install playwright --quiet
          playwright install chromium --with-deps --quiet

      - name: Visit and wake up Streamlit app
        run: |
          python3 - << 'PYEOF'
          import asyncio
          from playwright.async_api import async_playwright

          APP_URL = "https://greenwashing-ai-gwri.streamlit.app"

          async def wake_up():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page()
                  print(f"[KeepAlive] Visiting {APP_URL} ...")

                  try:
                      await page.goto(APP_URL, wait_until="domcontentloaded", timeout=60000)
                      await page.wait_for_timeout(8000)

                      # 嘗試找並點擊喚醒 / Reboot 按鈕
                      for selector in [
                          "button:has-text('Yes, get this app back up!')",
                          "button:has-text('Wake app')",
                          "button:has-text('Reboot')",
                          "button:has-text('Wake')",
                      ]:
                          try:
                              btn = page.locator(selector)
                              if await btn.count() > 0:
                                  print(f"[KeepAlive] Found button: {selector}, clicking...")
                                  await btn.first.click()
                                  await page.wait_for_timeout(30000)
                                  print("[KeepAlive] App woken up successfully!")
                                  break
                          except Exception:
                              pass
                      else:
                          print("[KeepAlive] App is already running, no action needed.")

                  except Exception as e:
                      print(f"[KeepAlive] Error: {e}")
                  finally:
                      await browser.close()
                      print("[KeepAlive] Done.")

          asyncio.run(wake_up())
          PYEOF
