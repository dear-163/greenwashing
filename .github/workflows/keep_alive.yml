name: Keep Streamlit App Alive

on:
  schedule:
    # 每 2 小時自動喚醒一次 (UTC)，涵蓋台灣時區全天
    - cron: '0 */2 * * *'
  workflow_dispatch:  # 允許手動觸發

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Install Playwright
        run: |
          pip install playwright --quiet
          playwright install chromium --with-deps

      - name: Visit and wake up Streamlit app
        run: |
          python3 - << 'PYEOF'
          import asyncio
          from playwright.async_api import async_playwright

          APP_URL = "https://greenwashing-ai-gwri.streamlit.app"

          async def wake_up():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page()
                  print(f"[KeepAlive] Visiting {APP_URL} ...")

                  try:
                      await page.goto(APP_URL, wait_until="domcontentloaded", timeout=60000)
                      await page.wait_for_timeout(5000)

                      # 嘗試找並點擊喚醒 / Reboot 按鈕
                      clicked = False
                      for selector in [
                          "button:has-text('Yes, get this app back up!')",
                          "button:has-text('Wake app')",
                          "button:has-text('Reboot')",
                          "button:has-text('Wake')",
                      ]:
                          try:
                              btn = page.locator(selector)
                              if await btn.count() > 0:
                                  print(f"[KeepAlive] Found button: {selector}, clicking...")
                                  await btn.first.click()
                                  clicked = True
                                  # 等待 App 完全啟動
                                  await page.wait_for_timeout(40000)
                                  print("[KeepAlive] App woken up successfully!")
                                  break
                          except Exception:
                              pass

                      if not clicked:
                          print("[KeepAlive] App already running, keeping connection alive...")
                          # 停留 30 秒讓 Streamlit 記錄真實活躍連線
                          await page.wait_for_timeout(30000)
                          # 模擬滑動以維持活躍
                          await page.evaluate("window.scrollTo(0, 100)")
                          await page.wait_for_timeout(2000)
                          print("[KeepAlive] Done.")

                  except Exception as e:
                      print(f"[KeepAlive] Error: {e}")
                  finally:
                      await browser.close()

          asyncio.run(wake_up())
          PYEOF
